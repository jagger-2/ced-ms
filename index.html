<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CED-Multiservice</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#12151a">

<style>
:root{--bg:#f5f3ee;--card:#fff;--l:#e4e1d7;--fg:#12151a;--mu:#6b6f76;--c:#008fb8;--m:#d6126e;--y:#f2c500;--onc:#fff;--bm:multiply;--sh:0 1px 2px rgba(18,21,26,.05),0 10px 28px -14px rgba(18,21,26,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a1f;--l:#2a2f36;--fg:#f1efe8;--mu:#99a0a9;--c:#33c3ea;--m:#ff4fa0;--y:#ffd83a;--onc:#04141a;--bm:screen;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:110px}
h1,h2,.n,.k b,.hb2 b{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:-.02em}
h1{font-size:36px;line-height:1.03;margin:.3em 0;font-weight:800}h2{font-size:24px;margin:.2em 0 .4em;font-weight:800}
h3{margin:0 0 12px;font:700 12px Figtree,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;gap:8px}
h3:before{content:'';width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:6px 0 0 -1px var(--m),12px 0 0 -2px var(--y);margin-right:10px}
h4{margin:14px 0 6px;font:700 14px Figtree,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#00aeef 33.3%,#ec008c 33.3% 66.6%,#fff200 66.6%)}
header img{width:38px;height:38px;border-radius:11px;object-fit:cover;background:var(--card)}
.hb2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}.hb2 b{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb2 span{font-size:12px;color:var(--mu)}
.chip{border:1px solid var(--l);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 12px;font:600 12px Figtree,system-ui,sans-serif}
.av{width:36px;height:36px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font:800 15px 'Bricolage Grotesque',system-ui,sans-serif;overflow:hidden;padding:0}.av img{width:100%;height:100%;border-radius:0}
main{padding:14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--l);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.r{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0}.r>input,.r>select{flex:1;min-width:0}
input,select,textarea{width:100%;padding:13px 14px;margin:5px 0;border:1.5px solid var(--l);border-radius:14px;font:inherit;background:var(--bg);color:var(--fg);outline:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.b{width:100%;padding:14px;margin:6px 0;border:0;border-radius:999px;background:var(--fg);color:var(--bg);font:700 15px Figtree,system-ui,sans-serif;cursor:pointer}.b:active{transform:scale(.98)}
.b.o{background:var(--m);color:#fff}.b.c{background:var(--c);color:var(--onc)}.b.g{background:transparent;color:var(--fg);border:1.5px solid var(--l)}
.s{font-size:13px;color:var(--mu)}.low{color:var(--m);font-weight:700}a{color:var(--c);font-weight:600;cursor:pointer}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:616px;margin:auto;display:flex;gap:4px;padding:6px;background:var(--card);border:1px solid var(--l);border-radius:26px;box-shadow:0 12px 32px -10px rgba(0,0,0,.35);z-index:6}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:0;border-radius:20px;background:none;color:var(--mu);font:600 11px Figtree,system-ui,sans-serif;position:relative}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .on{background:var(--fg);color:var(--bg)}nav .on svg{stroke:var(--m)}
.bd{position:absolute;top:2px;right:22%;background:var(--m);color:#fff;border-radius:99px;font:700 10px Figtree,system-ui,sans-serif;padding:1px 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.k{position:relative;overflow:hidden;padding:16px 14px 12px;border-radius:20px;background:var(--card);border:1px solid var(--l);box-shadow:var(--sh)}
.k:before{content:'';position:absolute;left:14px;top:0;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--c)}.k.m:before{background:var(--m)}.k.y:before{background:var(--y)}
.k b{display:block;font-size:24px;font-weight:800;line-height:1.1;margin-top:4px}.k span{font-size:12px;color:var(--mu);font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--l);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:700 13px Figtree,system-ui,sans-serif;color:var(--mu)}.seg .on{background:var(--fg);color:var(--bg)}
.ch{width:100%;height:auto;display:block}.ax{font:600 9px Figtree,system-ui,sans-serif;fill:var(--mu)}
.hb{margin:10px 0}.tr{height:8px;border-radius:99px;background:var(--l);overflow:hidden;margin:4px 0 2px}.tr i{display:block;height:100%;border-radius:99px}
.rg{position:relative;height:12px;border-radius:99px;background:var(--l);margin:10px 0 8px}.rg i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--c);opacity:.45}.rg u{position:absolute;top:-3px;width:4px;height:18px;border-radius:2px;background:var(--m);transform:translateX(-2px)}
.s3{text-align:center;align-items:flex-start}.s3 span{flex:1;font-size:12px;color:var(--mu)}.s3 b{font:800 16px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--fg)}
.pj{padding:10px 0;border-top:1px solid var(--l)}.pj:first-of-type{border-top:0}
.dn{display:flex;align-items:center;gap:16px}.lg{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.lg i{width:10px;height:10px;border-radius:3px}
.hero{position:relative;min-height:calc(100vh - 120px);display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.art{position:relative;width:190px;align-self:flex-end;margin:0 -24px -26px 0;pointer-events:none}.art circle{mix-blend-mode:var(--bm)}
.hc{position:relative;z-index:1;padding:20px 4px;max-width:430px}.hc img{width:64px;height:64px;border-radius:18px;object-fit:cover}
.eye{font:700 12px Figtree,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--l);font-size:12px;font-weight:700}
@media print{header,nav,.np{display:none!important}body{padding:0}.card{box-shadow:none}}
.pr main>*:not(#rc){display:none!important}
</style></head><body>
<header id="hd"><img id="hl" alt=""><div class="hb2"><b id="hn"></b><span id="hr"></span></div><button class="chip" id="hd2" onclick="togD()" aria-label="Devise d’affichage"></button><button class="chip" id="hc" onclick="syncNow()"></button><button class="av" id="ha" onclick="logout()" aria-label="Compte"></button></header><main></main><nav></nav>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},Sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let st=L('ced',null)||{};st.set={name:'CED-Multiservice',logo:'',rate:130,disp:'HTG',cid:'',api:'',...st.set};for(const k of['items','sales','moves','orders'])st[k]=st[k]||{};
let q=L('ced_q',[]),me=L('ced_me',{}),tok=null,tab='sale',view='land',cart=L('ced_cart',[]),vid=null,pid=null,tgt=null,oq='',os='',eid=null,fq='',fg='',rk='m',rcId=null,usrs=[],busy=0;if(me.email==='local')me={};
const save=()=>{Sv('ced',st);Sv('ced_q',q)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=n=>(+n||0).toLocaleString('fr-FR',{maximumFractionDigits:2}),Ri=n=>Math.round(n).toLocaleString('fr-FR');
const cv=(v,c)=>c==='USD'?v*st.set.rate:v,cvr=(v,c,r)=>c==='USD'?v*r:v,DI=()=>st.set.disp==='USD'?'USD':'HTG',to=(v,f,t)=>f===t?v:f==='USD'?v*st.set.rate:v/st.set.rate,fx=(v,f)=>R(to(v,f,DI())),fd=v=>DI()==='USD'?R(v/st.set.rate):Ri(v),M=()=>st.set.m??30,OH=()=>st.set.oh??0,MD=()=>st.set.mode||'cout',cp=(k,m=M(),md=MD())=>Math.round((md==='pv'?k/(1-Math.min(m,95)/100):k*(1+m/100))*100)/100,pr=x=>x.auto&&x.k>0?cp(x.k):x.p;
const adm=()=>me.role==='admin',ok=()=>adm()||me.role==='vendeur',tr=x=>x.type!=='service',pend=()=>usrs.filter(u=>u.role==='pending').length;
const opts=f=>Object.entries(st.items).filter(([i,x])=>(x.n+' '+(x.cat||'')).toLowerCase().includes(f)).map(([i,x])=>`<option value=${i}>${esc(x.n)}${x.cat?' · '+esc(x.cat):''}</option>`).join('');
const stock=i=>{let n=+st.items[i].init||0;for(const m of Object.values(st.moves))if(m.i===i)n+=m.q;for(const s of Object.values(st.sales))for(const l of s.lines)if(l.i===i)n-=l.q;return n};
function apply(e){if(e.t==='settings')st.set={...st.set,...e.data};else if(e.t==='sale'){const d=e.data;if(d&&d.del){delete st.sales[e.id];delete st.orders[e.id]}else if(d&&d.o)st.orders[e.id]=d;else{delete st.orders[e.id];st.sales[e.id]=d}}else if(['item','move'].includes(e.t)){if(e.data&&e.data.del)delete st[e.t+'s'][e.id];else st[e.t+'s'][e.id]=e.data}}
function up(t,id,data){const e={t,id,data,ts:Date.now(),by:me.email};apply(e);q.push(e);save();sync();render()}
/* ---------- Service sécurisé (Apps Script) ---------- */
async function rpc(a,b={}){const r=await fetch(st.set.api,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,token:tok,...b})});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function wipe(){st.items={};st.sales={};st.moves={};st.orders={};cart=[];vid=null;pid=null;tgt=null;st.set.cur=0;st.set.seeded=0;q=[];save()}
function login(){return new Promise((res,rej)=>{if(!st.set.cid||!st.set.api)return rej(new Error('Application non configurée'));if(!window.google)return rej(new Error('Connexion internet requise'));
google.accounts.oauth2.initTokenClient({client_id:st.set.cid,scope:'openid email profile',callback:async r=>{try{if(r.error)throw new Error(r.error);tok=r.access_token;const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json(),em=String(u.email).toLowerCase();if(me.email&&me.email!==em){wipe();me={}}me={...me,email:em,name:u.name||em,pic:u.picture||''};Sv('ced_me',me);res()}catch(e){rej(e)}},error_callback:e=>rej(new Error(e.type||'Connexion annulée'))}).requestAccessToken({prompt:''})})}
async function enter(){const r=await rpc('me');if(!r.ok)throw new Error(r.err==='auth'?'Identité Google non vérifiée : contrôlez l’ID client enregistré dans le service':r.err);me.role=r.role;me.owner=!!r.owner;Sv('ced_me',me);if(me.role==='none')view='req';if(ok()){view='app';await sync();if(adm())loadUsers()}render()}
async function syncNow(){try{if(!tok)await login();await enter()}catch(e){alert(e.message)}}
async function sync(){if(!tok||!st.set.api||!ok())return;if(busy)return busy=2;busy=1;try{
if(adm()&&!st.set.seeded){for(const t of['item','sale','move'])for(const[id,data]of Object.entries(st[t+'s']))q.push({t,id,data,ts:Date.now(),by:me.email});const{name,logo,rate,m,oh,mode}=st.set;q.push({t:'settings',id:'s',data:{name,logo,rate,m,oh,mode},ts:Date.now(),by:me.email});st.set.seeded=1}
if(q.length){const b=q.slice(),r=await rpc('push',{ev:b});if(!r.ok)throw r;q=q.filter(e=>!b.includes(e))}
const r=await rpc('pull',{from:st.set.cur||0});if(!r.ok)throw r;r.ev.map(x=>{try{return JSON.parse(x)}catch{}}).filter(Boolean).sort((a,b)=>a.ts-b.ts).forEach(apply);st.set.cur=r.n;save()}
catch(e){if(e&&e.err==='auth')tok=null;else if(e&&e.err==='forbidden'){me.role=e.role||'none';Sv('ced_me',me)}}finally{const a=busy===2;busy=0;render();if(a)sync()}}
async function loadUsers(){if(!tok||!adm())return;try{const r=await rpc('users');if(r.ok){usrs=r.users;if(tab==='cfg')render();else $('nav').innerHTML=navH()}}catch{}}
async function setRole(i,r){try{if(!tok)await login();const x=await rpc('setRole',{email:usrs[i].email,role:r});if(!x.ok)return alert('Refusé : '+x.err);await loadUsers()}catch(e){alert(e.message)}}
async function addUser(){const e=$('#ue').value.trim().toLowerCase();if(!e.includes('@'))return;try{if(!tok)await login();const x=await rpc('addUser',{email:e});if(!x.ok)alert(x.err);await loadUsers()}catch(er){alert(er.message)}}
async function sendReq(){const n=$('#rn').value.trim();if(!n)return alert('Indiquez votre nom');try{if(!tok)await login();const r=await rpc('request',{name:n,phone:$('#rp').value.trim(),msg:$('#rm').value.trim()});if(!r.ok)throw new Error(r.err);me.role=r.role;me.owner=!!r.owner;Sv('ced_me',me);if(ok())await enter();else render()}catch(e){alert(e.message)}}
function logout(){if(!confirm('Compte : '+(me.email||'')+'\nSe déconnecter ? Les données de ce téléphone seront effacées'+(q.length?' (dont '+q.length+' opération(s) non synchronisée(s)).':'.')))return;wipe();tok=null;me={};Sv('ced_me',me);view='land';tab='sale';render()}
function saveSetup(){st.set.cid=$('#cid').value.trim();st.set.api=$('#api').value.trim();if(!st.set.cid||!st.set.api)return alert('Les deux champs sont requis');save();view='land';syncNow()}
function saveTech(){st.set.cid=$('#cid').value.trim();st.set.api=$('#api').value.trim();save();alert('Enregistré')}
function invite(){const u=location.origin+location.pathname+'#cid='+encodeURIComponent(st.set.cid)+'&api='+encodeURIComponent(st.set.api);navigator.share?navigator.share({title:'Rejoindre '+st.set.name,url:u}).catch(()=>{}):prompt('Copiez ce lien :',u)}
/* ---------- Graphiques SVG ---------- */
function bars(D,f=Ri){const W=340,Hh=140,p=6,bw=(W-p*2)/D.length,mx=Math.max(1,...D.map(d=>d.r));return `<svg viewBox="0 0 ${W} ${Hh+18}" class="ch">${D.map((d,i)=>{const x=p+i*bw,h=d.r/mx*Hh,h2=Math.max(0,d.n)/mx*Hh;return `<rect x="${x+bw*.12}" y="${Hh-h}" width="${bw*.76}" height="${Math.max(h,1)}" rx="3" fill="var(--c)"/><rect x="${x+bw*.3}" y="${Hh-h2}" width="${bw*.4}" height="${h2}" rx="2" fill="var(--m)"/>`+(d.l!==''?`<text x="${x+bw/2}" y="${Hh+13}" text-anchor="middle" class="ax">${d.l}</text>`:'')}).join('')}<line x1="0" x2="${W}" y1="${Hh}" y2="${Hh}" stroke="var(--l)"/><text x="${p}" y="9" class="ax">max ${f(mx)}</text></svg>`}
function hb(rows,f=Ri){const mx=Math.max(1,...rows.map(r=>Math.abs(r.v)));return rows.map((r,i)=>`<div class="hb"><div class="r"><span>${i+1}. ${esc(r.n)}</span><b class="n">${f(r.v)}</b></div><div class="tr"><i style="width:${Math.abs(r.v)/mx*100}%;background:${r.v<0?'var(--m)':'var(--c)'}"></i></div><span class="s">${r.s}</span></div>`).join('')}
function donut(P){const t=P.reduce((a,p)=>a+p.v,0)||1,C=2*Math.PI*40,col=['var(--c)','var(--m)','var(--y)','var(--fg)'];let o=0;return `<div class="dn"><svg viewBox="0 0 100 100" width="120" height="120"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--l)" stroke-width="14"/>${P.map((p,i)=>{const d=p.v/t*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${col[i%4]}" stroke-width="14" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-o}" transform="rotate(-90 50 50)"/>`;o+=d;return s}).join('')}</svg><div>${P.map((p,i)=>`<div class="lg"><i style="background:${col[i%4]}"></i>${esc(p.n)} <b>${Math.round(p.v/t*100)} %</b></div>`).join('')}</div></div>`}
function rg(lo,c,hi){const mx=Math.max(hi,1)*1.05,pc=v=>Math.max(0,v)/mx*100;return `<div class="rg"><i style="left:${pc(lo)}%;width:${pc(hi)-pc(lo)}%"></i><u style="left:${pc(c)}%"></u></div>`}
const tile=(l,v,c='')=>`<div class="k ${c}"><span>${l}</span><b>${v}</b></div>`;
const mark=`<svg viewBox="0 0 100 100" class="art"><circle cx="38" cy="42" r="26" fill="#00aeef"/><circle cx="62" cy="42" r="26" fill="#ec008c"/><circle cx="50" cy="64" r="26" fill="#fff200"/></svg>`;
const IC={sale:'<path d="M3 4h2l2.4 11h10.2L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',stk:'<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',cfg:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
/* ---------- Écrans d'accès ---------- */
function land(){const cfg=st.set.api&&st.set.cid;return `<section class="hero">${mark}<div class="hc">${st.set.logo?`<img src="${st.set.logo}" alt="">`:''}<div class="eye">Gestion d’entreprise</div><h1>${esc(st.set.name)}</h1><p class="s" style="font-size:16px">Ventes, stock et prix de l’entreprise, dans votre poche.</p>${cfg?`<button class="b" onclick="syncNow()">Se connecter avec Google</button><button class="b g" onclick="view='req';render()">Demander l’accès</button><p class="s">Accès réservé aux membres autorisés par un administrateur.</p>`:`<p class="s">Cet appareil n’est pas encore configuré. Ouvrez le lien d’invitation envoyé par votre administrateur.</p><button class="b g" onclick="view='setup';render()">Administrateur principal ? Configurer</button>`}</div></section>`}
const setupV=()=>`<div class="card"><h2>Configuration initiale</h2><p class="s">Réservé à l’administrateur principal.</p><input id="cid" placeholder="ID client Google"><input id="api" placeholder="Adresse du service (…/exec)"><button class="b" onclick="saveSetup()">Enregistrer et se connecter</button><button class="b g" onclick="view='land';render()">Retour</button></div>`;
const reqV=()=>`<div class="card"><div class="eye">Nouvel utilisateur</div><h2>Demande d’accès</h2><p class="s">Votre demande sera examinée par un administrateur. Vous serez identifié par votre compte Google.</p><input id="rn" placeholder="Nom complet" autocomplete="name"><input id="rp" type="tel" placeholder="Téléphone (facultatif)"><textarea id="rm" placeholder="Message (ex : vendeur au studio)"></textarea><button class="b o" onclick="sendReq()">Envoyer la demande</button><button class="b g" onclick="view='land';render()">Retour</button></div>`;
const waitV=()=>`<div class="card"><div class="eye">${me.role==='refuse'?'Accès refusé':'Demande envoyée'}</div><h2>${me.role==='refuse'?'Accès non accordé':'En attente d’approbation'}</h2><p>${me.role==='refuse'?'Un administrateur a refusé cet accès.':'Un administrateur doit approuver votre demande pour <b>'+esc(me.email)+'</b>.'}</p><button class="b" onclick="syncNow()">Actualiser</button><button class="b g" onclick="logout()">Changer de compte</button></div>`;
