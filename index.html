const V={

rep(){const oh=(st.set.oh||0)/100,sd=t=>{const x=new Date(t);x.setHours(0,0,0,0);return+x},L=[],pay={};let first=Infinity,rest=0,nS=0,rev=0,pf=0,nt=0;

function fsel(){$('#si').innerHTML=opts($('#ssq').value.toLowerCase());pick()}

function saveItem(){const n=$('#fn').value.trim();if(!n)return alert('Nom requis');const a=$('#fa').checked,k=+$('#fk').value||0;if(a&&!(k>0))return alert('Prix automatique : saisissez le coût');const id=eid||uid(),old=eid&&st.items[eid];eid=null;up('item',id,{n,type:$('#ft').value,cat:$('#fcat').value.trim(),auto:a,p:+$('#fp').value||0,cur:$('#fc2').value,k,init:old?old.init:+$('#fi').value||0,min:+$('#fm').value||0})}
function edit(i){eid=i;render();const x=st.items[i];$('#fn').value=x.n;$('#ft').value=x.type;$('#fc2').value=x.cur;$('#fcat').value=x.cat||'';$('#fa').checked=!!x.auto;$('#fp').value=x.p;$('#fk').value=x.k;lm();$('#fm').value=x.min;$('#fi').style.display='none';scrollTo(0,0)}
function restock(i){const n=+prompt('Quantité reçue (négatif = consommation) ?');if(n)up('move',uid(),{i,q:n,d:Date.now()})}
function invite(){if(!st.set.cid||!st.set.sid)return alert('Configurez d\'abord la synchronisation.');const u=location.origin+location.pathname+'#cid='+encodeURIComponent(st.set.cid)+'&sid='+encodeURIComponent(st.set.sid);navigator.share?navigator.share({title:'Rejoindre '+st.set.name,url:u}).catch(()=>{}):prompt('Copiez ce lien :',u)}function setRole(e,r){up('user',e,{role:r})}function addUser(){const e=$('#ue').value.trim().toLowerCase();if(e.includes('@'))up('user',e,{role:'vendeur'})}
function logo(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,0,0,128,128);up('settings','s',{logo:c.toDataURL('image/jpeg',.7)})};im.src=r.result};r.readAsDataURL(f.files[0])}
function csv(){const rows=[['Date','Vendeur','Client','Article','Qté','Prix','Devise','Coût unitaire','Devise coût','Paiement']];for(const s of Object.values(st.sales))for(const l of s.lines)rows.push([new Date(s.d).toLocaleString('fr-FR'),s.by,s.cl||'',l.n,l.q,l.p,l.c,l.k,l.kc,s.pm||'']);
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}));a.download='ventes.csv';a.click()}
function render(){document.title=st.set.name;$('#hn').textContent=st.set.name;const h=$('#hl');h.src=st.set.logo||'';h.style.display=st.set.logo?'':'none';$('#hu').textContent=me.name||'';const z=stt();if(z!=='ok'){$('nav').innerHTML='';$('main').innerHTML=`<div class=card><h3>${z==='wait'?'En attente d’approbation':'Accès refusé'}</h3><p>${z==='wait'?'Un administrateur doit approuver votre demande ('+esc(me.email)+'). Touchez Actualiser une fois approuvé.':'Un administrateur a refusé cet accès.'}</p><button class=b onclick=syncNow()>Actualiser</button></div>`;return}
$('nav').innerHTML=Object.entries({sale:'Vente',stk:'Stock',rep:'Rapports',cfg:'Config'+(adm()&&pend()?' ('+pend()+')':'')}).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');$('main').innerHTML=V[tab]();if(tab==='sale')pick();if(tab==='cfg'&&$('#sim'))simu()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});addEventListener('online',sync);if(location.hash.includes('cid=')){const h=new URLSearchParams(location.hash.slice(1));st.set.cid=h.get('cid')||st.set.cid;st.set.sid=h.get('sid')||st.set.sid;save();history.replaceState(null,'',location.pathname);tab='cfg'}render();
</script></body></html>
