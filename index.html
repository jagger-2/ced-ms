<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CED-Multiservice</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14171a">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{--ink:#14171a;--bg:#fbfbf8;--card:#fff;--l:#d8d8d0;--c:#007c9a;--m:#c2185b;--y:#f5c400;--fg:#14171a}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--card:#1b1e21;--l:#363b40;--fg:#f0f0ea;--c:#27b5d6;--m:#ec5f98}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:60px 0 64px}
header{position:fixed;top:0;left:0;right:0;height:52px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:5;border-bottom:4px solid;border-image:linear-gradient(90deg,#00aeef 33%,#ec008c 33% 66%,#fff200 66%) 1}
header img{height:32px;border-radius:4px}header b{flex:1;font-size:17px}header span{font-size:12px;opacity:.7}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--l)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--fg);font:600 14px system-ui}nav .on{color:var(--c);box-shadow:inset 0 3px var(--m)}
main{padding:12px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--l);border-radius:6px;padding:12px;margin-bottom:10px}
input,select,.b{width:100%;padding:11px;margin:4px 0;border:1px solid var(--l);border-radius:6px;font:inherit;background:var(--card);color:var(--fg)}
.b{background:var(--c);color:#fff;border:0;font-weight:600}.b.o{background:var(--m)}.b.g{background:none;color:var(--c);border:1px solid var(--c)}
.r{display:flex;gap:8px;align-items:center;justify-content:space-between}.r>input,.r>select{flex:1}.low{color:var(--m);font-weight:700}.s{font-size:13px;opacity:.7}h3{margin:6px 0}
a{color:var(--c);cursor:pointer}@media print{header,nav,.np{display:none}body{padding:0}}
</style></head><body>
<header><img id="hl" alt=""><b id="hn"></b><span id="hu"></span></header><main></main><nav></nav>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},Sv=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let st=L('ced',{set:{name:'CED-Multiservice',logo:'',rate:130,cid:'',sid:''},items:{},sales:{},moves:{},users:{},requests:{}}),q=L('ced_q',[]),me=L('ced_me',{email:'local',name:''}),tok=null,tab='sale',cart=[],eid=null;
st.requests=st.requests||{};const API='https://sheets.googleapis.com/v4/spreadsheets/',save=()=>{Sv('ced',st);Sv('ced_q',q)},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),R=n=>Math.round(n).toLocaleString('fr-FR'),cv=(v,c)=>c==='USD'?v*st.set.rate:v;
const adm=()=>me.email==='local'||!Object.keys(st.users).length||st.users[me.email]?.role==='admin',tr=x=>x.type!=='service',pend=()=>Object.keys(st.requests).filter(e=>!st.users[e]).length,stt=()=>{if(me.email==='local'||!Object.keys(st.users).length)return'ok';const u=st.users[me.email];return u?(u.role==='refuse'?'no':'ok'):'wait'};
const stock=i=>{let n=+st.items[i].init||0;for(const m of Object.values(st.moves))if(m.i===i)n+=m.q;for(const s of Object.values(st.sales))for(const l of s.lines)if(l.i===i)n-=l.q;return n};
function apply(e){if(e.t==='settings')st.set={...st.set,...e.data};else if(st[e.t+'s'])st[e.t+'s'][e.id]=e.data}
function up(t,id,data){const e={t,id,data,ts:Date.now(),by:me.email};apply(e);q.push(e);save();sync();render()}
async function g(u,o={}){const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function login(){return new Promise((ok,ko)=>{if(!st.set.cid)return ko(new Error('ID client Google manquant (Config)'));if(!window.google)return ko(new Error('Connexion internet requise'));
google.accounts.oauth2.initTokenClient({client_id:st.set.cid,scope:'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',callback:async r=>{if(r.error)return ko(new Error(r.error));tok=r.access_token;const u=await g('https://www.googleapis.com/oauth2/v3/userinfo');me={email:u.email,name:u.name||u.email};Sv('ced_me',me);ok()}}).requestAccessToken({prompt:''})})}
async function sync(){if(!tok||!st.set.sid)return;try{const A=API+st.set.sid+'/values/events!A:A';
if(q.length){await g(A+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:q.map(e=>[JSON.stringify(e)])})});q=[]}
((await g(A)).values||[]).map(r=>{try{return JSON.parse(r[0])}catch{}}).filter(Boolean).sort((a,b)=>a.ts-b.ts).forEach(apply);save();
if(me.email!=='local'&&!Object.keys(st.users).length)return up('user',me.email,{role:'admin'});if(stt()==='wait'&&!st.requests[me.email])return up('request',me.email,{n:me.name});render();const e=$('#ss');if(e)e.textContent='Synchronisé à '+new Date().toLocaleTimeString('fr-FR')}catch(e){tok=null;alert('Synchronisation échouée ('+e.message+'). Reconnectez-vous.')}}
async function syncNow(){try{if(!tok)await login();await sync()}catch(e){alert(e.message)}}
async function createDb(){try{if(!tok)await login();const r=await g(API,{method:'POST',body:JSON.stringify({properties:{title:'CED-Multiservice DB'},sheets:[{properties:{title:'events'}}]})});st.set.sid=r.spreadsheetId;
for(const t of['item','sale','move','user'])for(const[id,data]of Object.entries(st[t+'s']))q.push({t,id,data,ts:Date.now(),by:me.email});save();await sync();alert('Base créée. Partagez ce Google Sheet (droits Éditeur) avec les autres utilisateurs. ID : '+r.spreadsheetId)}catch(e){alert(e.message)}}
const V={
sale(){return `<div class=card><select id=si onchange=pick()>${Object.entries(st.items).map(([i,x])=>`<option value=${i}>${esc(x.n)}</option>`).join('')}</select><div class=r><input id=sq type=number value=1 min=1 aria-label=Quantité><input id=sp type=number step=any aria-label=Prix><select id=sc><option>HTG<option>USD</select></div><button class=b onclick=add()>Ajouter au panier</button></div>
<div class=card>${cart.map((l,k)=>`<div class=r><span>${esc(l.n)} ×${l.q}</span><span>${R(l.p*l.q)} ${l.c} <a onclick="cart.splice(${k},1);render()">✕</a></span></div>`).join('')||'<span class=s>Panier vide : choisissez un article.</span>'}
${cart.length?`<h3>Total : ${R(cart.reduce((a,l)=>a+l.p*l.q,0))} ${cart[0].c}</h3><input id=sa type=number placeholder="Avance reçue (acompte)"><input id=scl placeholder="Client"><select id=sst><option>Livré<option>Reçue<option>En production</select><button class="b o" onclick=done()>Valider la vente</button>`:''}</div>`},
stk(){const f=adm()?`<div class=card><h3>${eid?'Modifier':'Nouvel'} article</h3><input id=fn placeholder="Nom"><div class=r><select id=ft><option value=produit>Produit<option value=matiere>Matière première<option value=service>Service</select><select id=fc><option>HTG<option>USD</select></div><div class=r><input id=fp type=number step=any placeholder="Prix"><input id=fk type=number step=any placeholder="Coût"></div><div class=r><input id=fi type=number placeholder="Stock initial"><input id=fm type=number placeholder="Seuil bas"></div><button class=b onclick=saveItem()>Enregistrer</button></div>`:'';
return f+Object.entries(st.items).map(([i,x])=>{const n=tr(x)?stock(i):null;return `<div class=card><div class=r><b>${esc(x.n)}</b><span>${R(x.p)} ${x.cur}</span></div><div class=r><span class="${tr(x)&&n<=x.min?'low':'s'}">${tr(x)?'Stock : '+n+(n<=x.min?' (bas)':''):'Service'}</span><span>${tr(x)?`<a onclick="restock('${i}')">+ Réappro</a> `:''}${adm()?`<a onclick="edit('${i}')">Modifier</a>`:''}</span></div></div>`}).join('')||'<p class=s>Aucun article. '+(adm()?'Ajoutez-en un ci-dessus.':'Un administrateur doit en créer.')+'</p>'},
rep(){const wk=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return+x},W={},P={};let rev=0,pf=0;
for(const s of Object.values(st.sales))for(const l of s.lines){const r=cv(l.p*l.q,l.c),p=r-cv(l.k*l.q,l.kc),w=wk(s.d);W[w]=(W[w]||0)+r;rev+=r;pf+=p;P[l.n]=(P[l.n]||0)+p}
const ks=Object.keys(W).sort().slice(-4),av=ks.length?ks.reduce((a,k)=>a+W[k],0)/ks.length:0,low=Object.entries(st.items).filter(([i,x])=>tr(x)&&stock(i)<=x.min),top=Object.entries(P).sort((a,b)=>b[1]-a[1]).slice(0,5);
return `<div class=card><h3>1. Ventes par semaine (HTG)</h3>${ks.map(k=>`<div class=r><span>Sem. du ${new Date(+k).toLocaleDateString('fr-FR')}</span><b>${R(W[k])}</b></div>`).join('')||'<span class=s>Aucune vente.</span>'}<p>Moyenne/semaine : <b>${R(av)}</b><br>Projection mois (×52/12) : <b>${R(av*52/12)}</b><br>Projection année (×52) : <b>${R(av*52)}</b></p><span class=s>Extrapolation linéaire de la moyenne des 4 dernières semaines avec ventes ; elle ignore la saisonnalité.</span></div>
<div class=card><h3>2. Stock bas</h3>${low.map(([i,x])=>`<div class=r><span>${esc(x.n)}</span><b class=low>${stock(i)}</b></div>`).join('')||'<span class=s>Rien sous le seuil.</span>'}</div>
<div class=card><h3>3. Bénéfices (HTG, taux ${st.set.rate})</h3>Chiffre d'affaires : <b>${R(rev)}</b><br>Bénéfice : <b>${R(pf)}</b><br>Marge : <b>${rev?(pf/rev*100).toFixed(1):0} %</b></div>
<div class=card><h3>4. Articles les plus rentables</h3>${top.map(([n,v])=>`<div class=r><span>${esc(n)}</span><b>${R(v)}</b></div>`).join('')||'<span class=s>Pas de données.</span>'}</div>
<div class="card np"><button class=b onclick=csv()>Exporter en Excel (CSV)</button><button class="b g" onclick=print()>Exporter en PDF (Imprimer)</button></div>`},
cfg(){const u=Object.entries(st.users);return `<div class=card><h3>Synchronisation Google</h3><input id=cid placeholder="ID client OAuth Google" value="${esc(st.set.cid)}"><input id=sid placeholder="ID du Google Sheet" value="${esc(st.set.sid)}"><button class="b g" onclick="st.set.cid=$('#cid').value.trim();st.set.sid=$('#sid').value.trim();save();syncNow()">Se connecter et synchroniser</button>${adm()&&!st.set.sid?'<button class="b o" onclick=createDb()>Créer la base (premier administrateur)</button>':''}<div class=s id=ss>${me.email==='local'?'Mode local (non synchronisé)':'Connecté : '+esc(me.email)}</div></div>`+(adm()?`<div class=card><h3>Entreprise</h3><input id=cn value="${esc(st.set.name)}"><input id=cr type=number step=any value="${st.set.rate}" aria-label="1 USD en HTG"><span class=s>Taux : 1 USD = ? HTG</span><input type=file accept=image/* onchange=logo(this)><button class=b onclick="up('settings','s',{name:$('#cn').value,rate:+$('#cr').value||1})">Enregistrer</button></div>
${(()=>{const p=Object.entries(st.requests).filter(([e])=>!st.users[e]);return p.length?`<div class=card><h3>Demandes d'accès</h3>${p.map(([e,x])=>`<div class=r><span>${esc(x.n||'')}<br><span class=s>${esc(e)}</span></span><span><a onclick="setRole('${esc(e)}','vendeur')">Approuver</a> <a onclick="setRole('${esc(e)}','refuse')">Refuser</a></span></div>`).join('')}</div>`:''})()}<div class=card><h3>Utilisateurs</h3>${u.map(([e,x])=>`<div class=r><span>${esc(e)}<br><span class=s>${x.role}</span></span><span>${x.role==='admin'?`<a onclick="setRole('${esc(e)}','vendeur')">→ vendeur</a>`:x.role==='vendeur'?`<a onclick="setRole('${esc(e)}','admin')">→ admin</a> <a onclick="setRole('${esc(e)}','refuse')">bloquer</a>`:`<a onclick="setRole('${esc(e)}','vendeur')">rétablir</a>`}</span></div>`).join('')||'<span class=s>Aucun (mode local).</span>'}<input id=ue placeholder="Email Gmail"><button class="b g" onclick=addUser()>Ajouter comme vendeur</button><button class="b o" onclick=invite()>Envoyer le lien d'invitation</button></div>`:'')}};
function pick(){const x=st.items[$('#si').value];if(x){$('#sp').value=x.p;$('#sc').value=cart.length?cart[0].c:x.cur}}
function add(){const i=$('#si').value,x=st.items[i];if(!x)return;const n=+$('#sq').value,p=+$('#sp').value;if(!(n>0)||!(p>=0))return alert('Quantité ou prix invalide');if(tr(x)&&n>stock(i)&&!confirm('Stock insuffisant. Continuer ?'))return;cart.push({i,n:x.n,q:n,p,c:cart.length?cart[0].c:$('#sc').value,k:x.k||0,kc:x.cur});render()}
function done(){const l=cart,tot=l.reduce((a,x)=>a+x.p*x.q,0),adv=+$('#sa').value||0,c=l[0].c,d={d:Date.now(),lines:l,adv,cl:$('#scl').value,stt:$('#sst').value,by:me.email};cart=[];up('sale',uid(),d);
const t=`${st.set.name}\n${new Date().toLocaleDateString('fr-FR')}${d.cl?' – '+d.cl:''}\n`+l.map(x=>`${x.n} ×${x.q} : ${R(x.p*x.q)} ${c}`).join('\n')+`\nTOTAL : ${R(tot)} ${c}\nAvance : ${R(adv)}\nReste : ${R(tot-adv)} ${c}`;
navigator.share?navigator.share({text:t}).catch(()=>{}):alert(t)}
function saveItem(){const n=$('#fn').value.trim();if(!n)return alert('Nom requis');const id=eid||uid();up('item',id,{n,type:$('#ft').value,p:+$('#fp').value||0,cur:$('#fc').value,k:+$('#fk').value||0,init:eid?st.items[id].init:+$('#fi').value||0,min:+$('#fm').value||0});eid=null}
function edit(i){eid=i;render();const x=st.items[i];$('#fn').value=x.n;$('#ft').value=x.type;$('#fc').value=x.cur;$('#fp').value=x.p;$('#fk').value=x.k;$('#fm').value=x.min;$('#fi').style.display='none';scrollTo(0,0)}
function restock(i){const n=+prompt('Quantité reçue (négatif = consommation) ?');if(n)up('move',uid(),{i,q:n,d:Date.now()})}
function invite(){if(!st.set.cid||!st.set.sid)return alert('Configurez d\'abord la synchronisation.');const u=location.origin+location.pathname+'#cid='+encodeURIComponent(st.set.cid)+'&sid='+encodeURIComponent(st.set.sid);navigator.share?navigator.share({title:'Rejoindre '+st.set.name,url:u}).catch(()=>{}):prompt('Copiez ce lien :',u)}function setRole(e,r){up('user',e,{role:r})}function addUser(){const e=$('#ue').value.trim().toLowerCase();if(e.includes('@'))up('user',e,{role:'vendeur'})}
function logo(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,0,0,128,128);up('settings','s',{logo:c.toDataURL('image/jpeg',.7)})};im.src=r.result};r.readAsDataURL(f.files[0])}
function csv(){const rows=[['Date','Vendeur','Client','Article','Qté','Prix','Devise','Coût unitaire','Devise coût']];for(const s of Object.values(st.sales))for(const l of s.lines)rows.push([new Date(s.d).toLocaleString('fr-FR'),s.by,s.cl||'',l.n,l.q,l.p,l.c,l.k,l.kc]);
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}));a.download='ventes.csv';a.click()}
function render(){document.title=st.set.name;$('#hn').textContent=st.set.name;const h=$('#hl');h.src=st.set.logo||'';h.style.display=st.set.logo?'':'none';$('#hu').textContent=me.name||'';const z=stt();if(z!=='ok'){$('nav').innerHTML='';$('main').innerHTML=`<div class=card><h3>${z==='wait'?'En attente d’approbation':'Accès refusé'}</h3><p>${z==='wait'?'Un administrateur doit approuver votre demande ('+esc(me.email)+'). Touchez Actualiser une fois approuvé.':'Un administrateur a refusé cet accès.'}</p><button class=b onclick=syncNow()>Actualiser</button></div>`;return}
$('nav').innerHTML=Object.entries({sale:'Vente',stk:'Stock',rep:'Rapports',cfg:'Config'+(adm()&&pend()?' ('+pend()+')':'')}).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('');$('main').innerHTML=V[tab]();if(tab==='sale')pick()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});addEventListener('online',sync);if(location.hash.includes('cid=')){const h=new URLSearchParams(location.hash.slice(1));st.set.cid=h.get('cid')||st.set.cid;st.set.sid=h.get('sid')||st.set.sid;save();history.replaceState(null,'',location.pathname);tab='cfg'}render();
</script></body></html>
